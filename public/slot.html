<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
#messages { flex: 1; overflow-y: auto; padding: 1rem; }
#composer { display: flex; gap: .5rem; padding: .75rem; border-top: 1px solid #ddd; }
#composer input { flex: 1; padding: .6rem; font-size: 1rem; }
#composer button { padding: .6rem 1rem; }
.msg-user { text-align: right; color: #075; margin: .5rem 0; }
.msg-assistant { text-align: left; color: #333; margin: .5rem 0; white-space: pre-wrap; }
.msg-tool { text-align: left; color: #888; margin: .5rem 0; font-size: .85em; font-style: italic; }
#archived-list { padding: 1rem; border-top: 1px solid #ddd; font-size: .9em; }
#archived-list a { display: block; margin: .25rem 0; }
#busy-indicator { text-align: center; padding: .5rem; color: #888; font-size: .85em; }
#login-screen { max-width: 320px; margin: 4rem auto; display: flex; flex-direction: column; gap: .5rem; }
#login-error { color: red; font-size: .9em; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<form id="login-form">
  <div id="login-screen">
    <input id="pin" type="password" placeholder="PIN" required autocomplete="off">
    <button type="submit">Entrar</button>
    <span id="login-error"></span>
  </div>
</form>
<div id="chat-screen" hidden>
  <div id="messages"></div>
  <div id="busy-indicator" hidden>Procesando…</div>
  <div id="archived-list"></div>
  <form id="composer">
    <input id="text" placeholder="Escribí tu mensaje" autocomplete="off">
    <button type="submit">Enviar</button>
  </form>
</div>
<script src="/slot.js"></script>
</body>
</html>
