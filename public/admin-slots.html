<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colaboradores</title>
<style>
body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
td, th { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
form { display: flex; gap: .5rem; margin: 1rem 0; flex-wrap: wrap; }
input, select { padding: .4rem; }
#new-slot-pin { font-weight: bold; }
</style>
</head>
<body>
<h1>Colaboradores</h1>
<p style='color:#888;font-size:.85em'>Codex y Gemini todavia no estan habilitados para slots (no tienen aislamiento por usuario del sistema) — ver src/slots.js.</p>
<table id="slots-table"><thead><tr><th>Nombre</th><th>Proyecto</th><th>Motor</th></tr></thead><tbody></tbody></table>
<h2>Nuevo slot</h2>
<form id="new-slot-form">
  <input id="label" placeholder="Nombre (ej. Fernando)" required>
  <input id="osUser" placeholder="Usuario del sistema (ej. colab-fernando)" required>
  <input id="projectPath" placeholder="/home/colab-fernando/proyecto" required>
  <select id="engine">
    <option value="claude">Claude</option>
  </select>
  <button type="submit">Crear</button>
</form>
<p id="new-slot-pin"></p>
<script src="/admin-slots.js"></script>
</body>
</html>
